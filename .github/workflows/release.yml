name: Release

# There is NO precedent for this anywhere in this maintainer's repos: zero git
# tags, zero GitHub releases exist yet, and until this workflow claude-session
# had no `.github/` directory at all. This is a deliberate extension of the CI
# philosophy already in place (explicit promotion, verify-before-ship, minimal
# permissions) — not a port of an existing release pipeline. See
# docs/releasing.md for the full writeup.
#
# Never automatic. Never triggered by a push or another workflow completing —
# only a human, naming an exact version and an exact already-CI-passed commit.
#
#   gh workflow run Release -f version=v0.2.0 -f release_sha=$(git rev-parse origin/main)
#   gh run watch
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (must match VERSION= in bin/claude-session at release_sha)"
        required: true
        type: string
      release_sha:
        description: Full commit SHA on main that CI has already passed (git rev-parse origin/main)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: claude-session-release
  cancel-in-progress: false

# Every `run:` step uses an explicit `shell: bash`, which GitHub Actions maps to
# `bash --noprofile --norc -eo pipefail {0}`. Without this the default is
# `bash -e {0}` with NO pipefail, and a step like `run-tests.sh | tee log` would
# report the exit status of `tee` — i.e. green on a failing suite. Do not remove.
defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate inputs and CI status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.inputs.outputs.sha }}
      tag: ${{ steps.inputs.outputs.tag }}
      version_no_v: ${{ steps.inputs.outputs.version_no_v }}
      has_tui: ${{ steps.detect.outputs.has_tui }}
    steps:
      - name: Validate input shapes
        id: inputs
        # Bind the raw inputs via env: before touching them in the script,
        # rather than splicing `${{ inputs.* }}` directly into the shell text
        # — this is still unvalidated user-typed text at this point, and an
        # env var can't break out of the script the way a literal substring
        # containing quotes/`;`/`$(...)` could.
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.release_sha }}
        run: |
          version="$VERSION"
          sha="$SHA"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like v0.2.0, got: $version" >&2
            exit 1
          fi
          if ! [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character commit SHA, got: $sha" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${version#v}" >> "$GITHUB_OUTPUT"

      # Promotion is explicit (workflow_dispatch only), so nothing upstream of
      # this workflow already proved the revision was checked. Prove it here:
      # no successful CI run for this exact SHA, no release.
      - name: Verify a successful CI run exists for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ steps.inputs.outputs.sha }}"
          runs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success")"
          if [ "$(jq '.total_count' <<<"$runs")" -le 0 ]; then
            echo "No successful CI run found for $sha." >&2
            echo "  run it first:  gh workflow run CI --ref $sha && gh run watch" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.inputs.outputs.sha }}
          fetch-depth: 0

      # Re-releasing a version number silently is how a user ends up with two
      # different binaries claiming the same version — catch a stale VERSION=
      # (forgot to bump it) as well as a genuinely wrong release_sha/version pair.
      - name: Verify VERSION= in bin/claude-session matches the requested version
        run: |
          file_version="$(sed -n 's/^VERSION="\(.*\)"/\1/p' bin/claude-session)"
          want="${{ steps.inputs.outputs.version_no_v }}"
          if [ "$file_version" != "$want" ]; then
            echo "bin/claude-session at ${{ steps.inputs.outputs.sha }} reports" >&2
            echo "VERSION=\"$file_version\", but this release was requested as" >&2
            echo "${{ steps.inputs.outputs.tag }}. Either bump VERSION= at that" >&2
            echo "SHA and re-run CI, or request the version that matches it." >&2
            exit 1
          fi

      - name: Refuse to re-release an existing tag
        run: |
          tag="${{ steps.inputs.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — refusing to release a version twice." >&2
            exit 1
          fi

      # There is no Go binary to build yet — the TUI does not exist in this
      # repository. This flag turns the build job on automatically the moment
      # tui/go.mod is added at a released SHA; no edit to this workflow is
      # needed. Until then, `build` below is skipped (not failed), and the
      # release ships with no binary assets — see docs/releasing.md, "The Go
      # build: today vs. after tui/ lands".
      - name: Detect whether the Go TUI exists yet at this SHA
        id: detect
        run: |
          if [ -f tui/go.mod ]; then
            echo "has_tui=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tui=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    if: needs.validate.outputs.has_tui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            run_os: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: darwin-arm64
            run_os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.run_os }}
    timeout-minutes: 20
    steps:
      # UNTESTED — pre-written against §12.2 of the TUI design spec, since
      # tui/ does not exist in this repository yet and this job cannot run
      # today (see the `if:` above). It only starts executing real steps the
      # first time a release_sha has tui/go.mod, at which point review this
      # block against the actual module layout before trusting it blindly.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod

      - name: Build natively (no cross-compilation)
        working-directory: tui
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.validate.outputs.version_no_v }} -X main.schemaMin=1 -X main.schemaMax=1" \
            -o "dist/claude-session-tui-${{ matrix.target }}" \
            ./cmd/claude-session-tui

      - name: Smoke-test --check on the runner that built it
        working-directory: tui
        run: |
          out="$("./dist/claude-session-tui-${{ matrix.target }}" --check)"
          echo "$out"
          echo "$out" | grep -q "${{ needs.validate.outputs.version_no_v }}" || {
            echo "--check did not report the expected version" >&2
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: claude-session-tui-${{ matrix.target }}
          path: tui/dist/claude-session-tui-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Create tag and GitHub release
    needs: [validate, build]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Download built binaries, if any
        if: needs.validate.outputs.has_tui == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: claude-session-tui-*
          path: dist
          merge-multiple: true

      - name: Compute checksums for every asset
        id: sums
        run: |
          if [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            ( cd dist && sha256sum * ) > SHA256SUMS
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the CHANGELOG section for this version
        run: |
          ver="${{ needs.validate.outputs.version_no_v }}"
          awk -v ver="$ver" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$ver]' section — add one before releasing." >&2
            exit 1
          fi

      # This is where the first tag in this repository's history gets created
      # — by the workflow, from a CI-verified SHA, not by a human running
      # `git tag` from a laptop.
      - name: Create the annotated tag
        run: |
          tag="${{ needs.validate.outputs.tag }}"
          sha="${{ needs.validate.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$sha"
          git push origin "$tag"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.validate.outputs.tag }}"
          if [ "${{ steps.sums.outputs.has_assets }}" = "true" ]; then
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release-notes.md \
              --verify-tag \
              dist/* SHA256SUMS
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release-notes.md \
              --verify-tag
          fi
